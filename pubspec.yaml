name: disciphobby_tracker
description: "A reliable hobby tracking application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Анимации и тактильный отклик
  lottie: ^3.1.2
  haptic_feedback: ^0.5.1+1

  # Эмодзи-пикер (все актуальные Unicode эмодзи + поиск + недавние)
  emoji_picker_flutter: ^3.0.0

  # Надежная типобезопасная SQLite БД (Drift)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # Утилиты
  intl: ^0.19.0
  share_plus: ^12.0.2 # Обновлено для совместимости с web ^1.0.0
  local_auth: ^2.3.0
  encrypt: ^5.0.3
  uuid: ^4.5.0
  shared_preferences: ^2.5.5
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
